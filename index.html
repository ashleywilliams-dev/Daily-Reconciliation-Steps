<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steps of Daily Reconciliation</title>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #440B39;
    --rule: #E6E6E6;
    --bg: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: "Funnel Display", "Inter", system-ui, sans-serif;
    color: var(--purple);
    display: flex;
    flex-direction: column;
    font-size: 24px;
    height: 100%;
  }
  ol {
    list-style: none;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 0.1em 0.8em 0.2em;
    counter-reset: step;
  }
  li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 1.3em 1fr;
    column-gap: 0.9em;
    align-items: center;
    padding: 0.1em 0;
    border-bottom: 1px solid var(--rule);
  }
  li:last-child { border-bottom: 0; }
  li::before {
    content: counter(step);
    width: 1.3em; height: 1.3em;
    border-radius: 50%;
    background: var(--purple);
    color: #fff;
    font-weight: 700;
    font-size: 0.75em;
    display: flex; align-items: center; justify-content: center;
  }
  .name { font-weight: 700; font-size: 1em; line-height: 1.15; }
</style>
</head>
<body>
  <ol>
    <li><div><div class="name">Ending Count Submitted</div></div></li>
    <li><div><div class="name">All Transactions Released</div></div></li>
    <li><div><div class="name">All Issues Released</div></div></li>
    <li><div><div class="name">Variance Is 0</div></div></li>
    <li><div><div class="name">LILLY Qty Is 0</div></div></li>
  </ol>
</body>
</html>
